<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auto Rename · Cấu hình</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#e8edf6;background:#0d1421}body{margin:0}main{max-width:900px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:30px;margin:0}h2{font-size:20px}nav{display:flex;gap:14px}a{color:#9dc5ff}section{background:#162338;border:1px solid #2b415e;border-radius:16px;padding:22px;margin-top:22px}.row{border-top:1px solid #2b415e;padding:12px 0;display:grid;grid-template-columns:210px 1fr;gap:12px}.label{color:#a5b7cc}.value{overflow-wrap:anywhere;font-family:ui-monospace,monospace}.muted{color:#a5b7cc}
  </style>
</head>
<body>
<main>
  <header><div><h1>Cấu hình</h1><div class="muted">Giá trị đang nạp từ settings.json</div></div><nav><a href="/">Dashboard</a><a href="/duplicates">Điều khiển</a><a href="/records">Nhật ký</a></nav></header>
  <section><h2>Trạng thái</h2><p>Chỉnh <code>settings.json</code> và biến môi trường trong <code>.env.runtime</code>, rồi khởi động lại container. Token D1 không hiển thị trên web hoặc nằm trong Git.</p><div id="values"></div></section>
  <p id="error" role="status"></p>
</main>
<script>
fetch('/api/settings').then(async response => { if (!response.ok) throw new Error(await response.text()); return response.json(); }).then(settings => {
  const labels = { dir: 'Thư mục quét', quarantine_dir: 'Thư mục cách ly', dry_run: 'Chạy thử', cron: 'Cron', cron_expr: 'Lịch cron', web_only: 'Chỉ giao diện', rename_subfolder: 'Quét thư mục con', extensions: 'Loại file', updated_at: 'Cập nhật' };
  for (const [key, label] of Object.entries(labels)) {
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('div'); name.className = 'label'; name.textContent = label;
    const value = document.createElement('div'); value.className = 'value'; value.textContent = Array.isArray(settings[key]) ? settings[key].join(', ') : String(settings[key]);
    row.append(name, value); document.getElementById('values').append(row);
  }
}).catch(error => { document.getElementById('error').textContent = error.message; });
</script>
</body>
</html>
