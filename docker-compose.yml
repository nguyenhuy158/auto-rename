services:
  auto-rename:
    container_name: auto-rename
    image: auto-rename:latest
    user: "1000:100"
    ports:
      - "127.0.0.1:8768:8080"
    env_file:
      - .env.runtime
    volumes:
      - ${STASH_DATA_DIR:?Set STASH_DATA_DIR in .env}:/app/data
      - ./quarantine:/app/quarantine
      - ./settings.json:/app/settings.json:ro
    command: ["-config=/app/settings.json"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
